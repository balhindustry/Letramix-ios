name: Letramix
options:
  bundleIdPrefix: fi.balh
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Letramix:
    type: application
    platform: iOS
    sources:
      - path: Letramix
        excludes: [Resources]
      - path: Letramix/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.balh.letramix
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LETRAMIX
        INFOPLIST_KEY_NSCameraUsageDescription: 'LETRAMIX lukee kameralla pelin kirjaimet ja sanat. Kuvat käsitellään vain puhelimessa.'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Letramix:
    build:
      targets:
        Letramix: all
